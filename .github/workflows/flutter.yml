      run_bloc_lint: false
  strings:
    name: Spanish strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Every English message needs its Spanish (the Swift app's 100% rule, carried over; its
      # catalog is scripts/data/Localizable.xcstrings).
      - run: python3 scripts/arb-spanish.py --self-test
      - run: python3 scripts/arb-spanish.py --check

  ui_contract:
    name: UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No new styling literals or raw Material widgets in app/lib (docs/specs/flutter/ui-contract.md).
      - run: python3 scripts/flutter-ui-check.py --self-test
      - run: python3 scripts/flutter-ui-check.py

