name: Release

# A push to main is a merged release PR from development. This uploads the Flutter app to TestFlight and
# deploys Cloud Functions to the prod Firebase project.
#
# CI is not run again here. The "Protect main" ruleset admits only a PR whose CI checks passed on
# a branch up to date with main, so the merge commit is the code those checks tested.
#
# Both jobs use the `release` environment: it holds every secret below, accepts deployments
# from main only, and waits for the owner's approval, so a merge alone ships nothing.
# Submitting a TestFlight build for App Review stays manual, in App Store Connect.
#
# Environment secrets:
#   FLUTTER_DART_DEFINES              base64 of app/dart_defines.json
#   FLUTTER_FIREBASE_OPTIONS_PROD     base64 of app/lib/firebase_options_production.dart
#   FLUTTER_GOOGLE_SERVICE_INFO_PROD  base64 of app/ios/flavors/production/GoogleService-Info.plist
#   ASC_API_KEY_P8                    contents of the App Store Connect API key (.p8)
#   ASC_API_KEY_ID                    its Key ID
#   ASC_API_ISSUER_ID                 the team's Issuer ID
# Update a FLUTTER_* secret whenever its file changes, or the release ships stale keys.
# KEYS_SWIFT and GOOGLE_SERVICE_INFO_PROD were the Swift app's; nothing reads them now.
#
# Cloud Functions needs no secret: the job proves it is this repo's `release` environment to
# Google through workload identity federation, and gets an hour-long token for the
# github-release service account. The pool's condition admits only andrewcoyle1/Compound, and
# only the `release` environment's subject may impersonate the account.
on:
  push:
    branches: [main]

# Third-party code here runs with prod credentials, so every action is pinned to a commit (the
# tag is in the comment) and firebase-tools to an exact version. Bump them deliberately.
#
# Never two releases at once, and never cancel one half-way through an upload or deploy.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    # After the backend, so a build that relies on new Cloud Functions never reaches testers ahead
    # of them, or at all if their deploy fails. It asks for its own approval once that job is done.
    needs: functions
    # The Flutter app (app/), production flavor: prod Firebase (dialed-c3cb5) and the App Store
    # app's ids. Swift is no longer released from here (tag swift-final keeps it). Xcode 27.0 on
    # the xcode-27 image, as the Flutter production builds have been archived by hand.
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    env:
      XCODE_APP: /Applications/Xcode_27.app
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # The Flutter version the app is built and tested with (CI's very_good_workflows too).
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # The gitignored production config, from secrets: the dart-defines (RevenueCat, Mixpanel and
      # Strava keys), the prod Firebase options and the production flavor's GoogleService plist.
      # The development options are only imported by the development entry point, so CI's example
      # stands in for them.
      - name: Write config and the API key from secrets
        env:
          FLUTTER_DART_DEFINES: ${{ secrets.FLUTTER_DART_DEFINES }}
          FLUTTER_FIREBASE_OPTIONS_PROD: ${{ secrets.FLUTTER_FIREBASE_OPTIONS_PROD }}
          FLUTTER_GOOGLE_SERVICE_INFO_PROD: ${{ secrets.FLUTTER_GOOGLE_SERVICE_INFO_PROD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$FLUTTER_DART_DEFINES" | base64 --decode > dart_defines.json
          printf '%s' "$FLUTTER_FIREBASE_OPTIONS_PROD" | base64 --decode > lib/firebase_options_production.dart
          mkdir -p ios/flavors/production
          printf '%s' "$FLUTTER_GOOGLE_SERVICE_INFO_PROD" | base64 --decode > ios/flavors/production/GoogleService-Info.plist
          cp lib/firebase_options_development.dart.example lib/firebase_options_development.dart
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # `--config-only` writes the Flutter build settings (the dart-defines, the production target
      # and flavor) into the Xcode project; the archive below then builds Dart and native together.
      # Plugins come in through Swift Package Manager (Flutter 3.47's default): no CocoaPods.
      - name: Prepare the Xcode project
        run: |
          flutter pub get
          flutter build ios --release --config-only --flavor production \
            -t lib/main_production.dart --dart-define-from-file=dart_defines.json

      # Signing is automatic and authenticated by the API key, so the runner needs no
      # certificates of its own: Xcode fetches or creates what the archive needs, and the export
      # signs for distribution with a cloud-managed certificate.
      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme production \
            -configuration Release-production \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Compound.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      # manageAppVersionAndBuildNumber takes the next free build number from App Store Connect,
      # as an upload from Xcode does, so the project's own build number never needs bumping. Not
      # internal-only: a release build must be able to reach external testers and App Review.
      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>teamID</key><string>VRNWC32C76</string>
              <key>signingStyle</key><string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key><true/>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Compound.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      # Each run's archive creates an Apple Development certificate for this throwaway machine;
      # left alone they fill the account's twelve slots and the next archive fails. Revoked
      # whether or not the upload worked, while the API key is still here.
      - name: Revoke this machine's development certificate
        if: always()
        working-directory: .
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/AuthKey.p8" ]; then
            ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" node scripts/revoke-ci-dev-certificates.mjs
          fi

      - name: Remove the API key and config
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" dart_defines.json lib/firebase_options_production.dart ios/flavors/production/GoogleService-Info.plist

  functions:
    name: Deploy Cloud Functions to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    # id-token lets the job request the GitHub OIDC token that Google exchanges for its own.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/94958324260/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release@dialed-c3cb5.iam.gserviceaccount.com

      # The auth step only writes a credential file; the token exchange happens on first use.
      # firebase-tools reports any failure there as "have you run firebase login?", so gcloud
      # asks first and prints Google's actual reason.
      - name: Check the Google credential works
        working-directory: .
        run: gcloud auth print-access-token --quiet > /dev/null && echo "Google accepted the workload identity credential"

      # The auth step points GOOGLE_APPLICATION_CREDENTIALS at a short-lived credential, which
      # firebase-tools picks up. Unchanged functions are skipped, so a release that touches none
      # of them deploys nothing. The Firestore rules go out with them: the app shipping with this
      # release reads collections only these rules open, and leaving them to a hand deploy left
      # prod nine days behind main (coach chats and Strava imports unreadable).
      - name: Deploy
        working-directory: .
        run: npx --yes firebase-tools@15.17.0 deploy --only functions,firestore:rules --project dialed-c3cb5 --non-interactive
