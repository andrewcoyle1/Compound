name: notifications_repository
description: "Compound notifications: deep links, push (Firebase Cloud Messaging) with the token in private settings, local reminders (rest over, idle workout, come-back, meals), and a fake for the staging flavor."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  app_settings: 9.0.0
  compound_models:
    path: ../compound_models
  equatable: ">=2.1.0 <4.0.0"
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_soloud: 5.1.6
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  user_repository:
    path: ../user_repository

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/sounds/

# flutter_soloud's build hook: WAV only, so it builds without the Xiph
# (Opus, Ogg, Vorbis, FLAC) libraries it would otherwise download.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
