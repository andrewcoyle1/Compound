name: Flutter

# The Flutter app in app/ (see docs/specs/flutter/plan.md); ci.yml tests the Cloud Functions.
#
# Runs on every pull request, but the jobs only do work when the app, the shared fixtures in
# contracts/ (the Firestore contract, the parity fixtures and the bundled catalogue), the checking
# scripts or this file change: `changes` decides, and the rest skip otherwise. The "Flutter CI"
# job at the end always reports, failing only if a job that ran failed. That is the check main's
# ruleset requires: a path filter on the trigger would leave a docs-only PR waiting for checks that
# never start, and a skipped reusable-workflow job reports under another name.
on:
  pull_request:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Flutter changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(app/|contracts/|scripts/flutter-ui-check\.py$|scripts/arb-spanish\.py$|scripts/data/|\.github/workflows/flutter\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the Flutter jobs check changed; they skip."
          fi

  app:
    name: Flutter app
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app
      flutter_version: "3.47.7"
      # Packages under app/packages are held at 100%; the app itself is reported, not gated
      # (docs/specs/flutter/plan.md, Coverage).
      min_coverage: 0
      # Firebase config is gitignored (public repo); the example has placeholder values, which is
      # all analysis and tests need. Runs after pub get, before format/analyze/test.
      setup: cp lib/firebase_options_development.dart.example lib/firebase_options_development.dart && cp lib/firebase_options_production.dart.example lib/firebase_options_production.dart

  compound_models:
    name: compound_models
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/compound_models
      dart_sdk: "3.13.5"
      # The contract test reads ../../../contracts/firestore, so the whole repository is checked
      # out (the workflow's default). Packages are held at 100%.
      min_coverage: 100

  app_ui:
    name: app_ui
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/app_ui
      flutter_version: "3.47.7"
      min_coverage: 100

  compound_charts:
