name: compound
description: "Compound - training, nutrition and body-composition tracking."
version: 1.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  ab_test_repository:
    path: packages/ab_test_repository
  ai_repository:
    path: packages/ai_repository
  analytics_repository:
    path: packages/analytics_repository
  app_ui:
    path: packages/app_ui
  auth_repository:
    path: packages/auth_repository
  bloc: ^9.2.1
  body_repository:
    path: packages/body_repository
  characters: ^1.4.1
  checkin_repository:
    path: packages/checkin_repository
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  coach_repository:
    path: packages/coach_repository
  compound_maths:
    path: packages/compound_maths
  compound_models:
    path: packages/compound_models
  connectivity_repository:
    path: packages/connectivity_repository
  cupertino_ui: ^1.1.3
  device_store:
    path: packages/device_store
  equatable: ">=2.1.0 <4.0.0"
  file_selector: ^1.1.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_remote_config: 6.7.0
  firebase_storage: 13.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  # Strava's consent page in a web authentication session (MIT).
  flutter_web_auth_2: 5.1.0
  food_repository:
    path: packages/food_repository
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  health_repository:
    path: packages/health_repository
  http: ^1.6.0
  image_repository:
    path: packages/image_repository
  # The system's rating prompt, Settings' Rate row and ReviewMoment (MIT).
  in_app_review: 2.0.12
  intl: ^0.20.2
  material_ui: ^1.1.1
  mobile_scanner: ^7.4.2
  notifications_repository:
    path: packages/notifications_repository
  nutrition_repository:
    path: packages/nutrition_repository
  # About's version and a new profile's creation_version (BSD-3).
  package_info_plus: 10.2.2
  path_provider: ^2.1.5
  program_repository:
    path: packages/program_repository
  purchases_repository:
    path: packages/purchases_repository
  # RevenueCat's paywall, the A/B test's revenueCat variant; the same native SDK
  # as purchases_repository's purchases_flutter, so both are exact (MIT).
  purchases_ui_flutter: 10.13.2
  share_plus: 13.3.1
  social_repository:
    path: packages/social_repository
  strava_repository:
    path: packages/strava_repository
  training_library_repository:
    path: packages/training_library_repository
  training_rules:
    path: packages/training_rules
  training_session:
    path: packages/training_session
  # "View on Strava" links (BSD-3).
  url_launcher: 6.3.2
  user_repository:
    path: packages/user_repository
  wakelock_plus: ^1.8.1
  workout_session_repository:
    path: packages/workout_session_repository

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  # Staging's in-memory Firestore, imported only by main_staging.dart, so the
  # development and production builds never depend on it.
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/equipment/
    - assets/exercises/
