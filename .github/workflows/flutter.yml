name: Flutter

# The Flutter app in app/ (see docs/specs/flutter/plan.md). Runs only when the app, the shared
# Firestore contract fixtures or this file change; the Swift CI in ci.yml is unaffected.
on:
  pull_request:
    paths:
      - "app/**"
      - "contracts/**"
      - ".github/workflows/flutter.yml"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app
      flutter_version: "3.47.7"
      # Packages under app/packages are held at 100%; the app itself is reported, not gated
      # (docs/specs/flutter/plan.md, Coverage).
      min_coverage: 0

  compound_models:
    name: compound_models
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/compound_models
      dart_sdk: "3.13.5"
      # The contract test reads ../../../contracts/firestore, so the whole repository is checked
      # out (the workflow's default). Packages are held at 100%.
      min_coverage: 100

  app_ui:
    name: app_ui
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/app_ui
      flutter_version: "3.47.7"
      min_coverage: 100
