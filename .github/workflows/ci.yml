name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push supersedes whatever is still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Compound - Development
  XCODE_APP: /Applications/Xcode_26.6.app
  # Pinned deliberately. `brew install swiftlint` tracks latest, and a newer
  # SwiftLint can add rules that fail --strict on code that lints clean
  # locally. Keep this in step with the version developers install; bumping it
  # means fixing whatever the new rules report, in its own change.
  SWIFTLINT_VERSION: 0.59.1

jobs:
  build-and-test:
    name: Lint, build and unit test
    # macos-26 is GA and ships the iOS 26 SDK. The Xcode 27 image is still
    # labelled preview and is arm64-only, so it is not used here.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Pinned rather than left on the image default, which GitHub bumps
      # periodically. Xcode 26.6 is the current default on macos-26; the
      # project is objectVersion 77 with LastUpgradeCheck 2620, so 26.x opens
      # it, and 26.6 carries the iOS 26 SDK this app targets.
      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not present on this runner image."
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      # These four files are gitignored because they hold real credentials.
      # Only the Crashlytics run-script phase reads the plists and it exits
      # early for simulator builds, so the checked-in examples are sufficient
      # to compile and to run the unit tests.
      - name: Materialise gitignored config from examples
        run: |
          set -euo pipefail
          cp Compound/Utilities/Keys.swift.example Compound/Utilities/Keys.swift
          cp Compound/Info.plist.example Compound/Info.plist
          plists=Compound/SupportingFiles/GoogleServicePLists
          cp "$plists/GoogleService-Info-Example.plist" "$plists/GoogleService-Info-Dev.plist"
          cp "$plists/GoogleService-Info-Example.plist" "$plists/GoogleService-Info-Prod.plist"

      - name: Cache SwiftLint
        uses: actions/cache@v4
        with:
          path: ~/.swiftlint/${{ env.SWIFTLINT_VERSION }}
          key: swiftlint-${{ runner.os }}-${{ env.SWIFTLINT_VERSION }}

      # The official portable build is a universal (x86_64 + arm64) Mach-O
      # binary, so it runs on the arm64 runner without Rosetta.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          set -euo pipefail
          dest="$HOME/.swiftlint/$SWIFTLINT_VERSION"
          if [ ! -x "$dest/swiftlint" ]; then
            echo "Downloading SwiftLint $SWIFTLINT_VERSION"
            mkdir -p "$dest"
            curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/portable_swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
            unzip -q -o "$RUNNER_TEMP/portable_swiftlint.zip" -d "$dest"
            chmod +x "$dest/swiftlint"
          else
            echo "Using cached SwiftLint $SWIFTLINT_VERSION"
          fi
          echo "$dest" >> "$GITHUB_PATH"

      # Separate step: GITHUB_PATH only takes effect for subsequent steps.
      - name: Verify SwiftLint version
        run: |
          set -euo pipefail
          actual="$(swiftlint version)"
          if [ "$actual" != "$SWIFTLINT_VERSION" ]; then
            echo "::error::Expected SwiftLint $SWIFTLINT_VERSION but found $actual (from $(command -v swiftlint))"
            exit 1
          fi
          echo "SwiftLint $actual from $(command -v swiftlint)"

      # Runs before the build so a style failure reports in a minute or two
      # rather than after a cold compile. main is at zero violations.
      - name: SwiftLint
        run: swiftlint --strict

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          path: ~/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Compound.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The clone directory is kept OUTSIDE the repository on purpose. The app
      # has a Run Script build phase that runs bare `swiftlint` from the
      # project root on every build, and .swiftlint.yml excludes only .git,
      # .claude/worktrees, Pods and Carthage. Checking dependencies out inside
      # the working directory makes that phase lint RevenueCat, promises and
      # the rest, which fails the build on their force_cast, large_tuple and
      # identifier_name violations. Locally these live in DerivedData, well
      # away from the linted tree; this keeps CI to the same arrangement.
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Compound.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages"

      # The device lineup differs between runner images, so the destination is
      # discovered rather than hardcoded. Picking the *newest* iOS runtime
      # matters: older runtimes are often also installed and cannot run an
      # app whose deployment target is iOS 26.
      - name: Select an iPhone simulator
        id: sim
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys

          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          devices = json.loads(raw)["devices"]

          def version(runtime):
              m = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              return (int(m.group(1)), int(m.group(2) or 0)) if m else (0, 0)

          best = None
          for runtime, devs in devices.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              phones = [d for d in devs
                        if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if not phones:
                  continue
              candidate = (version(runtime), phones[0]["name"])
              if best is None or candidate[0] > best[0]:
                  best = candidate

          if best is None:
              sys.exit("No available iPhone simulator on this runner image")

          (major, minor), name = best
          if major < 26:
              sys.exit(f"Newest iOS runtime is {major}.{minor}; need 26.0 or later")

          print(f"name={name}")
          print(f"os={major}.{minor}")
          PY

      - name: Show selected simulator
        run: echo "Testing on ${{ steps.sim.outputs.name }} (iOS ${{ steps.sim.outputs.os }})"

      # UI tests are skipped: three tests, one chronically flaky in the
      # simulator, and they need their own simulator clone. They are the bulk
      # of the wall-clock cost and the usual cause of a spurious TEST FAILED.
      #
      # Signing is deliberately left enabled. A simulator build needs no
      # provisioning profile and signs itself ad-hoc ("Sign to Run Locally"),
      # exactly as it does on a developer machine. Passing
      # CODE_SIGNING_ALLOWED=NO skips entitlement processing altogether, which
      # leaves the test host without keychain access and fails the eight
      # StravaManagerTests that read and write tokens.
      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project Compound.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            -skip-testing:CompoundUITests \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  functions:
    name: Cloud Functions unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
