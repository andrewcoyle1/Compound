name: app_ui
description: "Compound's own design system: tokens, theme and primitives."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  # AppConfetti's particles. MIT; its licence ships in the app's NOTICES
  # with every other package's.
  confetti: 0.8.0
  cupertino_ui: ^1.1.3
  flutter:
    sdk: flutter
  intl: ^0.20.2
  material_ui: ^1.1.1

dev_dependencies:
  # Golden tests (docs/specs/flutter/ui-contract.md, rule 6). MIT.
  alchemist: 0.14.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/
    - assets/fonts/OFL.txt
  # Nunito 3.602 (google/fonts at 8b0a1d0f), instanced from the variable
  # font at the two weights used (700, 800) and subset to Latin. SIL Open
  # Font License 1.1: assets/fonts/OFL.txt, registered by
  # AppTextStyles.registerFontLicense.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
