name: compound
description: "Compound - training, nutrition and body-composition tracking."
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  app_ui:
    path: packages/app_ui
  auth_repository:
    path: packages/auth_repository
  bloc: ^9.2.1
  cloud_firestore: ^6.10.0
  compound_models:
    path: packages/compound_models
  equatable: ^3.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  material_ui: ^1.1.1
  user_repository:
    path: packages/user_repository

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
