name: workout_session_repository
description: Reads and writes the signed-in user's workout sessions in Firestore, or in memory in the staging flavor.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cloud_firestore: ^6.10.0
  compound_models:
    path: ../compound_models
  flutter:
    sdk: flutter

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
