  flutter-ci:
    name: Flutter CI
    if: always()
    needs: [changes, app, compound_models, app_ui, compound_charts, compound_maths, auth_repository, workout_session_repository, user_repository, nutrition_repository, body_repository, checkin_repository, social_repository, connectivity_repository, strings, ui_contract, training_rules, analytics_repository, training_library_repository, program_repository, food_repository, training_session, image_repository, purchases_repository, device_store, ab_test_repository, notifications_repository, ai_repository, coach_repository, health_repository, strava_repository]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
