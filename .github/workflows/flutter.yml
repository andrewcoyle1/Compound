name: Flutter

# The Flutter app in app/ (see docs/specs/flutter/plan.md). Runs only when the app, the shared
# fixtures in contracts/ (the Firestore contract, the parity fixtures and the bundled catalogue),
# the checking scripts or this file change; ci.yml tests the Cloud Functions.
on:
  pull_request:
    paths:
      - "app/**"
      - "contracts/**"
      - "scripts/flutter-ui-check.py"
      - "scripts/arb-spanish.py"
      - "scripts/data/**"
      - ".github/workflows/flutter.yml"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app
      flutter_version: "3.47.7"
      # Packages under app/packages are held at 100%; the app itself is reported, not gated
      # (docs/specs/flutter/plan.md, Coverage).
      min_coverage: 0
      # Firebase config is gitignored (public repo); the example has placeholder values, which is
      # all analysis and tests need. Runs after pub get, before format/analyze/test.
      setup: cp lib/firebase_options_development.dart.example lib/firebase_options_development.dart && cp lib/firebase_options_production.dart.example lib/firebase_options_production.dart

  compound_models:
    name: compound_models
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/compound_models
      dart_sdk: "3.13.5"
      # The contract test reads ../../../contracts/firestore, so the whole repository is checked
      # out (the workflow's default). Packages are held at 100%.
      min_coverage: 100

  app_ui:
    name: app_ui
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/app_ui
      flutter_version: "3.47.7"
      min_coverage: 100

  compound_charts:
    name: compound_charts
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/compound_charts
      flutter_version: "3.47.7"
      # Goldens run as tests, as in app_ui. Packages are held at 100%.
      min_coverage: 100

  compound_maths:
    name: compound_maths
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/compound_maths
      dart_sdk: "3.13.5"
      min_coverage: 100
      run_bloc_lint: false
  auth_repository:
    name: auth_repository
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
    with:
      working_directory: app/packages/auth_repository
      flutter_version: "3.47.7"
      # min_coverage defaults to 100, the gate for every package under app/packages.

  workout_session_repository:
    name: workout_session_repository
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1
