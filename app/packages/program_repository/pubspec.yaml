name: program_repository
description: Reads and writes the signed-in user's mesocycles and macrocycles in Firestore, or in memory in the staging flavor, and sets up training (a gym, a prebuilt program) across the repositories.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cloud_firestore: ^6.10.0
  compound_models:
    path: ../compound_models
  flutter:
    sdk: flutter
  training_library_repository:
    path: ../training_library_repository
  user_repository:
    path: ../user_repository
  workout_session_repository:
    path: ../workout_session_repository

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
