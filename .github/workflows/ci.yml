name: CI

# Pull requests only. main accepts nothing but a PR whose checks passed on a branch up to date
# with it (the "Protect main" ruleset), so the merge commit is the code already tested here, and
# Release starts from the push without running this again.
on:
  pull_request:
    # The Flutter app has its own workflow (flutter.yml). This one runs the Cloud Functions tests
    # on every pull request.

# One run per ref: a new push supersedes whatever is still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Cloud Functions unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
